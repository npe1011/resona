[package]
name = "resona"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
ndarray-npy = "0.9"
num-complex = "0.4"
rustfft = "6.2"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
egui = "0.29"
eframe = "0.29"
rfd = "0.15"

[dev-dependencies]
approx = "0.5"
